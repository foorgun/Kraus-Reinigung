# Netlify-Konfiguration
# Vor dem ersten Deploy unter "Site settings → Environment variables" setzen:
#   PUBLIC_FORM_WEBHOOK_URL  – Ziel-URL des Kontaktformulars (z. B. n8n)
#   PUBLIC_SITE_URL          – die endgültige Domain, z. B. https://www.kraus-....de

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Lange Cache-Zeiten für gehashte Build-Assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
